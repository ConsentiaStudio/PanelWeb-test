<style>
/* (4.0.1) Panel rediseñado: la misma estética que la agenda y la calculadora (negro, rosa Consentia, tarjetas blancas y
   las fechas «‹ HOY ›»). En el ordenador, menú negro a la izquierda; en el móvil, las pestañas abajo. Gráficos en SVG
   dibujados aquí mismo (no se carga nada de fuera). */
:root{--ink:#111113;--pink:#ff2b91;--pinkD:#c2006b;--pinkS:#ffe3f0;--muted:#77736c;--line:#e4e0d8;--line2:#efebe4;--bg:#f4f2ee;--card:#fff;
  --good:#1d7a43;--goodS:#e4f3e8;--warn:#8a5a00;--warnS:#fdf1d3;--bad:#a20f3b;--badS:#fbe3ea}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.msg{padding:10px 12px;border-radius:8px;margin:0 0 14px;font-size:14px}.msg.bad{background:var(--badS);color:var(--bad)}.msg.ok{background:var(--goodS);color:var(--good)}.msg.warn{background:var(--warnS);color:var(--warn)}
.hint{font-size:13px;color:var(--muted);line-height:1.45}

/* ---------- la entrada (igual que la de la agenda) ---------- */
html.lock,html.lock body{height:100%}
html.lock body{overflow:hidden}
.lockLogos{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.lockLogo{position:absolute;display:block;user-select:none}
.brandTop{position:fixed;top:calc(26px + env(safe-area-inset-top));left:34px;z-index:2;display:flex;align-items:center;gap:12px}
.brandTop img{width:34px;height:34px}
.brandTop b{font-size:13px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
.lwrap{position:relative;z-index:1;min-height:100%;display:grid;grid-template-columns:minmax(0,440px);justify-content:center;align-content:center;padding:40px 18px}
.lcard{width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:44px 44px 34px;box-shadow:0 1px 0 rgba(17,17,19,.03),0 28px 60px -34px rgba(17,17,19,.28)}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--pinkD)}
.eyebrow::before{content:"";width:18px;height:2px;background:var(--pink)}
.lcard h1{margin:12px 0 6px;font-size:30px;line-height:1.1;letter-spacing:-.025em;font-weight:800}
.lcard .sub{margin:0 0 28px;color:var(--muted);font-size:14.5px}
.lb{display:block;font-size:13px;font-weight:700;color:#34322d;margin:0 0 7px}
.field{display:flex;align-items:center;min-height:52px;border:1px solid #d4cfc6;border-radius:8px;background:#fff;transition:border-color .15s,box-shadow .15s;margin-bottom:16px}
.field:focus-within{border-color:var(--ink);box-shadow:0 0 0 4px rgba(255,43,145,.14)}
.field>svg{margin-left:15px;color:#8a867e;width:19px;height:19px}
.field input,.field textarea{flex:1;min-width:0;height:50px;border:0;background:transparent;padding:0 10px 0 11px;font-size:16px;outline:0}
.field textarea{height:auto;min-height:76px;padding:12px;resize:vertical;font:13px/1.4 ui-monospace,Consolas,monospace;word-break:break-all}
.field input::placeholder,.field textarea::placeholder{color:#a19c94}
.eye{flex:none;width:48px;height:50px;border:0;background:transparent;display:grid;place-items:center;color:#8a867e}
.rowx{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin:-4px 0 22px;font-size:13.5px}
.lnk{color:var(--pinkD);font-weight:700;text-decoration:underline;text-underline-offset:3px;background:none;border:0;padding:0;font-size:13.5px;white-space:nowrap}
.go{width:100%;height:52px;border:0;border-radius:8px;background:var(--ink);color:#fff;font-size:15.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 12px 24px -14px rgba(17,17,19,.7)}
.go:hover{background:#26262b}.go:disabled{opacity:.6}
.go svg{width:18px;height:18px;stroke:#fff}
.alt{width:100%;height:50px;border:1px solid #d4cfc6;border-radius:8px;background:#fff;font-size:14.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px}
.alt svg{width:18px;height:18px}
.or{display:flex;align-items:center;gap:12px;color:#a19c94;font-size:12px;margin:22px 0 0}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.lfoot{margin:24px 0 0;text-align:center;color:var(--muted);font-size:13px}
.steps{display:flex;gap:6px;margin:0 0 22px}.steps i{flex:1;height:4px;border-radius:2px;background:#e9e5de}.steps i.on{background:var(--pink)}
.note{display:flex;gap:10px;background:#f7f5f1;border:1px solid var(--line);border-radius:8px;padding:11px 13px;font-size:13px;color:#4a4742;margin:4px 0 20px}
.note svg{width:18px;height:18px;color:var(--muted);margin-top:1px}
@media (max-width:560px){
  .brandTop{position:static;justify-content:center;padding:calc(34px + env(safe-area-inset-top)) 0 0}
  html.lock body{overflow:auto}
  .lwrap{min-height:auto;padding:24px 16px 40px;align-content:start}
  .lcard{padding:30px 22px 26px;border-radius:14px}.lcard h1{font-size:26px}.lcard .sub{margin-bottom:24px}
}

/* ---------- el panel: en el móvil, cabecera negra + pestañas abajo; en el ordenador, menú negro a la izquierda ---------- */
.side .brand,.side .grp,.side .foot{display:none}
.mtop{position:sticky;top:0;z-index:6;background:var(--ink);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
.mtop img{width:26px;height:26px;filter:invert(1)}
.mtop b{font-size:13px;letter-spacing:.14em;text-transform:uppercase;flex:1}
.mtop button{background:transparent;border:1px solid #444;color:#fff;border-radius:4px;padding:6px 9px;display:flex}
.mtop button svg{width:17px;height:17px}
.days{display:flex;align-items:center;gap:6px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:calc(49px + env(safe-area-inset-top));z-index:5}
.days button{background:#fff;color:var(--ink);border:1px solid #bdb9b1;border-radius:2px;min-width:38px;height:38px;font-size:18px;line-height:1;padding:0}
.days button:disabled{opacity:.35}
.days .hoy{font-size:11px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;padding:0 12px}
.days .d{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:14px;font-weight:800;text-align:left;position:relative}
.days .d span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.days .d input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;padding:0}
.days .upd{display:none;font-size:12px;color:var(--muted);white-space:nowrap}
main{padding:12px 12px calc(84px + env(safe-area-inset-bottom));max-width:1240px;margin:0 auto}
.tabsNav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabsNav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}
.tabsNav button.on{color:var(--pink)}
.tabsNav button .l2{display:none}
@media (min-width:900px){
  body.dash #app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
  .mtop{display:none}
  .side{display:flex;flex-direction:column;background:var(--ink);color:#fff;position:sticky;top:0;height:100vh;padding:22px 14px 16px}
  .side .brand{display:flex;align-items:center;gap:12px;padding:0 6px 22px;border-bottom:1px solid #2a2a30}
  .side .brand img{width:34px;height:34px;filter:invert(1)}
  .side .brand b{display:block;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase}
  .side .brand small{display:block;color:#9a978f;font-size:11px;letter-spacing:.06em;margin-top:2px}
  .side .grp{display:block;font-size:10.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#77756f;padding:18px 10px 8px}
  .tabsNav{position:static;display:block;background:none;border:0;padding:0}
  .tabsNav button{flex-direction:row;gap:12px;width:100%;color:#d8d5cf;padding:10px 12px;border-radius:2px;font-size:14px;font-weight:600;text-align:left;position:relative}
  .tabsNav button:hover{background:#1c1c20}
  .tabsNav button.on{background:#202024;color:#fff}
  .tabsNav button.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--pink)}
  .tabsNav button .l1{display:none}.tabsNav button .l2{display:inline}
  .side .foot{display:grid;margin-top:auto;gap:8px}
  .side .foot button{border:1px solid #3a3a40;background:transparent;color:#fff;border-radius:2px;padding:9px;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
  .side .foot small{color:#77756f;font-size:11px;text-align:center}
  .days{top:0;padding:14px 28px}.days .d{flex:0 1 340px}.days .upd{display:block;margin-left:auto}
  main{padding:22px 28px 40px}
}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:2px 2px 14px}
.head h1{margin:0;font-size:24px;letter-spacing:-.02em}
.head .sub{color:var(--muted);font-size:13px}
.eb{font:700 10.5px ui-monospace,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0}
.kpi span{display:block;font-size:12px;font-weight:700;color:#4a4742}
.kpi strong{display:block;font-size:24px;letter-spacing:-.02em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.kpi strong span{display:inline;font-size:inherit;font-weight:inherit;color:inherit}.kpi strong .pos{color:var(--good)}.kpi strong .neg{color:var(--bad)}
.kpis.k3>.kpi:first-child{grid-column:1/-1}@media (min-width:600px){.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis.k3>.kpi:first-child{grid-column:auto}}
.kpi.hero{background:var(--ink);color:#fff;border-color:var(--ink)}.kpi.hero span{color:#cfcbc4}.kpi.hero small{color:#b9b5ad}
.pos{color:var(--good)}.neg{color:var(--bad)}.up{color:var(--good);font-weight:800}.down{color:var(--bad);font-weight:800}.kpi.hero .up{color:#7fe0a5}.kpi.hero .down{color:#ff9db8}
.grid{display:grid;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0;margin:0;container-type:inline-size}
@container (max-width:480px){.hide-n{display:none}}
.card h2{margin:0;font-size:15px;font-weight:800}
.card h3{margin:16px 0 6px;font-size:13.5px}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ch small{color:var(--muted);font-size:12.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:#44423d}
.legend i,.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.dot{border-radius:50%;width:9px;height:9px;margin-right:8px;vertical-align:0}
.chart{position:relative}.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-size:11px;fill:#77736c;font-family:inherit}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;border-radius:4px;padding:7px 9px;font-size:12px;line-height:1.45;white-space:nowrap;transform:translate(-50%,calc(-100% - 8px));display:none;z-index:9}
.tip b{display:block}
.hbar{display:grid;gap:14px}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"nm v" "tr tr";row-gap:6px;align-items:center;column-gap:10px;font-size:13px}
.hrow .nm{grid-area:nm;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hrow .v{grid-area:v;text-align:right;font-weight:800}.hrow .track{grid-area:tr}
.hrow .v small{font-weight:500;color:var(--muted);font-size:11.5px;margin-left:6px}
.track{position:relative;height:22px;background:var(--line2);border-radius:2px}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;min-width:2px}
.prev{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
@media (min-width:600px){.hrow{grid-template-columns:140px minmax(0,1fr) 120px;grid-template-areas:"nm tr v";row-gap:0}.hrow .v small{display:block;margin:0}}
.stack{display:flex;height:26px;gap:2px;margin:4px 0 12px}.stack div{border-radius:2px;min-width:3px}
.stack div:first-child{border-radius:4px 2px 2px 4px}.stack div:last-child{border-radius:2px 4px 4px 2px}
.pay{display:grid;gap:7px;font-size:13px}.pay div{display:flex;align-items:center;gap:8px}.pay div b{margin-left:auto}
.pay i{width:10px;height:10px;border-radius:2px;display:inline-block}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11.5px;font-weight:700;color:var(--muted);text-align:left;padding:0 8px 8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line2)}tr:last-child td{border-bottom:0}
td:first-child{white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 9px;background:var(--line2);color:#44423d;white-space:nowrap}
.pill.ok{background:var(--goodS);color:var(--good)}.pill.warn{background:var(--warnS);color:var(--warn)}.pill.bad{background:var(--badS);color:var(--bad)}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:1px 8px;background:var(--line2)}.tag.ok{background:var(--goodS);color:var(--good)}.tag.warn{background:var(--warnS);color:var(--warn)}
.minis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mini{background:var(--bg);border-radius:4px;padding:10px 12px;min-width:0}.mini span{font-size:12px;color:#4a4742;font-weight:700}.mini strong{display:block;font-size:19px;margin-top:2px;white-space:nowrap}.mini small{color:var(--muted);font-size:12px}
.loc{border-left:4px solid var(--c)}
.lh{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}.lh h2{font-size:17px}.lh .pill{margin-left:auto}
.unread{border:1.5px dashed #d9b25a;background:#fffbf0}
.why{display:flex;gap:12px;align-items:flex-start;font-size:13.5px;color:#5c3d00}.why svg{color:var(--warn);margin-top:1px}
.svc{display:grid;gap:7px;margin-top:6px}
.svc>div{display:grid;grid-template-columns:minmax(0,1fr) 40px 84px;gap:8px;font-size:13px;align-items:center}
.svc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.svc .bar{grid-column:1/-1;height:4px;background:var(--line2);border-radius:2px;margin-top:-3px}.svc .bar i{display:block;height:100%;border-radius:2px;background:var(--pink)}
.pct{display:inline-block;min-width:42px;text-align:center}
.empty{color:var(--muted);font-size:13.5px;margin:4px 0}
.foot2{text-align:center;color:var(--muted);font-size:12px;margin:18px 0 0}
/* (4.0.2) el calendario de «Elegir día» (como el de la agenda) */
.calBack{position:fixed;inset:0;z-index:20;background:rgba(17,17,19,.28)}
.calBox{position:fixed;z-index:21;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 24px 60px -20px rgba(17,17,19,.45);padding:14px 14px 12px;width:320px}
.calH{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.calH b{font-size:16px}
.calNav{width:40px;height:38px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:20px;line-height:1}
.calNav:disabled{opacity:.35}
.calG{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.calW{font-size:11px;font-weight:800;color:var(--muted);padding:4px 0}
.calD{height:40px;border:0;background:transparent;border-radius:8px;font-size:15px;font-weight:700;color:var(--ink)}
.calD:hover:not(:disabled){background:var(--bg)}
.calD.out{color:#bdb9b1}.calD:disabled{color:#d4d0c8;cursor:default}
.calD.today{color:var(--pink);font-weight:900}.calD.sel{background:var(--ink);color:#fff}
.calF{display:flex;align-items:center;gap:12px;margin-top:8px}
.calHoy{border:1px solid #bdb9b1;background:#fff;border-radius:6px;padding:8px 14px;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.05em}
.calF small{color:var(--muted);font-size:12px}
@media (max-width:599px){.calBox{left:0!important;right:0;bottom:0;top:auto!important;width:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}.calD{height:44px}}
/* (4.0.2) la rosquilla del equipo */
.donutBox{display:grid;grid-template-columns:170px minmax(0,1fr);gap:16px;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line2)}
.donutBox svg{width:170px;height:170px;display:block}
.donutBox path{cursor:pointer;transition:opacity .15s}
.donutBox.hot path:not(.on){opacity:.3}
.donutC{font-family:inherit}
.dLeg{display:grid;gap:4px;font-size:13px}
.dLeg button{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:5px 6px;border-radius:6px;text-align:left;width:100%}
.dLeg button:hover,.dLeg button.on{background:var(--bg)}
.dLeg i{width:10px;height:10px;border-radius:2px;flex:none}
.dLeg span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dLeg b{font-variant-numeric:tabular-nums}.dLeg small{color:var(--muted);min-width:38px;text-align:right}
@media (max-width:480px){.donutBox{grid-template-columns:1fr;justify-items:center}.dLeg{width:100%}}
.legend .ln{display:inline-block;width:16px;height:0;border-top:2px solid #a20f3b;margin-right:6px;vertical-align:3px}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted)}
.loading::before{content:"";width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--pink);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (min-width:600px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.minis{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:1100px){.g2{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}.g2b{grid-template-columns:repeat(2,minmax(0,1fr))}.span2{grid-column:1/-1}}
@media (max-width:599px){.head .sub{display:none}.hide-m{display:none}.minis.m2{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app"></div>
<div class="tip" id="tip"></div>
<script>
(function () {
  'use strict';
  var FORMAT = 'consentia-panel-1', LS = 'consentia-panel-v1', MIN_ITER = 100000, DEV_ITER = 600000;
  var app = document.getElementById('app'), tip = document.getElementById('tip');
  // Dónde están los resúmenes: https://USUARIO.github.io/PanelWeb(-test)/ → USUARIO/Panel(-test). (En este ordenador,
